services:
  db:
    image: postgres:16-alpine
    container_name: contratacion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: contratacion_app
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - .:/var/www/html                                  # código en vivo
      - docs_data:/var/www/html/storage/app/private      # documentos cargados
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  docs_data: